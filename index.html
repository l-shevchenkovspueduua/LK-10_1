<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Квест-практикум — Тема 10. Кібергігієна в документообігу</title>
    <style>
        :root {
            --bg-page: #F7F4EF;
            --bg-card: #FFFFFF;
            --bg-soft: #EFECE6;
            --text-main: #2C2623;
            --text-muted: #5C554E;
            --accent-olive: #4A5D4E;
            --accent-terracotta: #C86D51;
            --accent-amber: #D99B52;
            --border-color: #DCD5C9;
            --success-bg: #E6F3EA;
            --success-border: #84B893;
            --success-text: #255834;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            line-height: 1.55;
            padding: 20px 15px 40px;
        }

        .top-nav {
            max-width: 1020px;
            margin: 0 auto 20px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .stage-pill {
            padding: 9px 15px;
            border-radius: 999px;
            background: var(--bg-soft);
            border: 1px solid var(--border-color);
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }

        .stage-pill.active {
            background: var(--accent-olive);
            color: #FFFFFF;
            border-color: var(--accent-olive);
        }

        .stage-pill.done {
            background: var(--success-bg);
            color: var(--success-text);
            border-color: var(--success-border);
        }

        .quest-wrapper {
            max-width: 1020px;
            margin: 0 auto;
            background: var(--bg-card);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(44, 38, 35, 0.08);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .quest-page {
            display: none;
        }

        .quest-page.active {
            display: flex;
            flex-direction: row;
            min-height: 580px;
        }

        @media (max-width: 850px) {
            .quest-page.active {
                flex-direction: column;
            }
            .visual-pane {
                width: 100% !important;
                border-right: none !important;
                border-bottom: 1px solid var(--border-color);
            }
            .content-pane {
                width: 100% !important;
            }
        }

        .visual-pane {
            width: 36%;
            background: linear-gradient(155deg, #EFECE6 0%, #E2DDD2 100%);
            padding: 30px 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 1px solid var(--border-color);
        }

        .visual-card {
            width: 100%;
            max-width: 280px;
            background: #FFFFFF;
            border-radius: 18px;
            padding: 24px 18px;
            box-shadow: 0 8px 22px rgba(74, 93, 78, 0.1);
            text-align: center;
        }

        .visual-caption {
            margin-top: 14px;
            font-size: 13px;
            font-weight: 700;
            color: var(--accent-olive);
        }

        .content-pane {
            width: 64%;
            padding: 32px 34px;
            background: #FFFFFF;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .stage-badge {
            display: inline-block;
            background: var(--bg-soft);
            color: var(--accent-olive);
            font-size: 12px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 999px;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
        }

        h2 {
            font-size: 22px;
            color: var(--text-main);
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .theory-text {
            font-size: 14.5px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .callout-box {
            background: var(--bg-soft);
            border-left: 4px solid var(--accent-olive);
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 13.5px;
            margin-bottom: 16px;
            color: var(--text-main);
        }

        .reg-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
            background: var(--bg-page);
            padding: 14px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .reg-grid .full-row {
            grid-column: 1 / -1;
        }

        input[type="text"], input[type="email"], textarea {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 13.5px;
            font-family: inherit;
            background: #FFFFFF;
            color: var(--text-main);
        }

        textarea {
            resize: vertical;
            min-height: 56px;
        }

        .q-block {
            margin-bottom: 14px;
            background: var(--bg-page);
            padding: 14px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .q-title {
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .option-label {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            background: #FFFFFF;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1
